name: build-flip

# 按需透明构建 / on-demand transparency build.
#
# 私有仓库跑 Actions 会消耗机时；public 仓库的 Actions 机时免费。
# 所以：构建前把仓库临时转 public → dispatch build.yaml → 构建结束（无论成败）转回 private。
#
# 唯一入口：手动 dispatch **本** 工作流。不要再直接 dispatch build.yaml（那样仓库还是 private，
# 白耗机时）。本工作流文件必须存在于被 dispatch 的那个分支上。
#
# 步骤（单 job 串行）：
#   1. flip public   —— PATCH {"visibility":"public"}，可重试（GitHub 在可见性过渡期间会回 422
#                       "A previous visibility change is still in progress"），直到 HTTP 200 且 private=false
#   2. dispatch build—— POST .../workflows/build.yaml/dispatches（ref = 本工作流所在分支），
#                       再每 60s 轮询该 run 的 status/conclusion，上限 150 分钟
#   3. flip private  —— if: always()，完成/失败/超时都会执行，重试直到 HTTP 200 且 private=true
#   4. 汇报 build run 的 URL + 结论；build 非 success（含超时/找不到 run）则本 job 标红
#
# 保险丝：ensure-private.yaml（cron */30）在本工作流被杀掉、仓库长期滞留 public 时兜底转回。
#
# 公开窗口内：仓库内容可见（源码 / workflow 定义都公开），但 secrets 不可读、不可下载，
# artifacts 需要登录且有权限才能取；窗口 = build 时长 + 若干分钟 flip 开销。

on:
  workflow_dispatch:

# 与 ensure-private.yaml 共用同一个 group：翻转动作永不并发，避免保险丝打断正在进行的翻转。
concurrency:
  group: visibility-flip
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  flip-build-flip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      API: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      BUILD_WORKFLOW: build.yaml
      TARGET_REF: ${{ github.ref_name }}
    steps:
      - name: Flip repository to public
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secret ADMIN_TOKEN is empty — upload it (see visibility-build-workflow.md)"
            exit 1
          fi

          # PATCH 可见性可能返回 422（上一次过渡还没结束），所以"重试 PATCH"而不是只轮询状态：
          # 只有拿到 HTTP 200 且 private 字段真的变了才算成功。
          flip_to() {   # $1=public|private $2=want(private=true|false) $3=attempts $4=gap
            local vis="$1" want="$2" tries="$3" gap="$4" code i
            for i in $(seq 1 "$tries"); do
              code=$(curl -sS -o /tmp/flip.json -w '%{http_code}' -X PATCH "$API" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d "{\"visibility\":\"$vis\"}")
              priv=$(curl -sS --fail-with-body "$API" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" | jq -r '.private')
              echo "attempt $i/$tries: PATCH $vis HTTP $code, private=$priv $(head -c 200 /tmp/flip.json)"
              if [ "$code" = "200" ] && [ "$priv" = "$want" ]; then
                return 0
              fi
              sleep "$gap"
            done
            return 1
          }

          if flip_to public false 20 15; then
            echo "repository is PUBLIC"
          else
            echo "::error::repository did not become public (see attempts above)"
            exit 1
          fi

          # 二次确认公开视角真的可匿名读（public 才免费；只作提示，不阻断）
          anon=$(curl -sS -o /dev/null -w '%{http_code}' "$API" \
            -H "Accept: application/vnd.github+json" || true)
          echo "anonymous read of repo API: HTTP $anon"

      - name: Dispatch build and wait for it
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # 5 分钟回溯窗口，容忍 GitHub 与本 runner 的时钟偏差；只认这个窗口之后创建的 run。
          since=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "dispatching $BUILD_WORKFLOW on ref=$TARGET_REF (since=$since)"
          api -X POST "$API/actions/workflows/$BUILD_WORKFLOW/dispatches" \
            -d "{\"ref\":\"$TARGET_REF\"}" > /dev/null

          run_id=""
          for i in $(seq 1 30); do
            run_id=$(api "$API/actions/workflows/$BUILD_WORKFLOW/runs?branch=$TARGET_REF&event=workflow_dispatch&per_page=30" \
              | jq -r --arg since "$since" \
                  '[.workflow_runs[] | select(.created_at >= $since)] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            echo "attempt $i/30: dispatched run not visible yet, waiting 6s"
            sleep 6
          done
          if [ -z "$run_id" ]; then
            echo "::error::no build run appeared within ~180s after dispatch"
            exit 1
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "build run id=$run_id url=$run_url"
          {
            echo "BUILD_RUN_ID=$run_id"
            echo "BUILD_RUN_URL=$run_url"
          } >> "$GITHUB_ENV"

          deadline=$(( $(date +%s) + 150 * 60 ))
          while :; do
            json=$(api "$API/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$json")
            conclusion=$(jq -r '.conclusion // ""' <<<"$json")
            echo "$(date -u +%H:%M:%SZ) run $run_id status=$status conclusion=${conclusion:-<none>}"
            if [ "$status" = "completed" ]; then
              echo "BUILD_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::build run did not finish within 150 minutes"
              echo "BUILD_TIMEOUT=1" >> "$GITHUB_ENV"
              break
            fi
            sleep 60
          done

      # 必须 always()：build 失败、超时、dispatch 报错、甚至前面某步崩掉都要把仓库转回来。
      - name: Flip repository back to private
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secret ADMIN_TOKEN is empty — cannot restore private visibility"
            exit 1
          fi

          flip_to() {   # $1=public|private $2=want(true|false) $3=attempts $4=gap
            local vis="$1" want="$2" tries="$3" gap="$4" code i priv
            for i in $(seq 1 "$tries"); do
              code=$(curl -sS -o /tmp/flip.json -w '%{http_code}' -X PATCH "$API" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d "{\"visibility\":\"$vis\"}")
              priv=$(curl -sS --fail-with-body "$API" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" | jq -r '.private')
              echo "attempt $i/$tries: PATCH $vis HTTP $code, private=$priv $(head -c 200 /tmp/flip.json)"
              if [ "$code" = "200" ] && [ "$priv" = "$want" ]; then
                return 0
              fi
              sleep "$gap"
            done
            return 1
          }

          if flip_to private true 12 10; then
            echo "repository is PRIVATE again"
          else
            echo "::error::FAILED to restore private visibility — run ensure-private.yaml or PATCH manually"
            exit 1
          fi

      - name: Report build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### build-flip result"
            echo ""
            echo "- ref: \`${TARGET_REF}\`"
            echo "- build run: ${BUILD_RUN_URL:-<none>}"
            echo "- build conclusion: \`${BUILD_CONCLUSION:-<unknown>}\`"
            echo "- timeout: ${BUILD_TIMEOUT:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "build run url: ${BUILD_RUN_URL:-<none>}"
          echo "build conclusion: ${BUILD_CONCLUSION:-<unknown>}"

          if [ "${BUILD_TIMEOUT:-0}" = "1" ]; then
            echo "::error::build run timed out after 150 minutes (${BUILD_RUN_URL:-no url})"
            exit 1
          fi
          if [ "${BUILD_CONCLUSION:-}" != "success" ]; then
            echo "::error::build conclusion=${BUILD_CONCLUSION:-<none>} (${BUILD_RUN_URL:-no url})"
            exit 1
          fi
