name: build

# Private feebox-bett line.
# - No push trigger on purpose: branch pushes must never consume runners.
# - Manual verification goes through workflow_dispatch, releases through v* tags.
# - Android / macOS matrix entries removed, SignPath + keystore secrets are off.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Android (probe: single arm64 lane while wiring up signing) ---
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          # --- Desktop lanes (re-enabled once the android probe is green) ---
          # - platform: windows
          #   os: windows-2022
          #   arch: amd64
          # - platform: linux
          #   os: ubuntu-22.04
          #   arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Android signing material: keystore + local.properties.
      # Placed as early as possible so a bad secret fails the lane in seconds.
      # android/app/build.gradle.kts reads android/local.properties (rootProject)
      # and expects the keystore at android/app/keystore.jks.
      # NOTE: flutter's updateLocalProperties() merges into local.properties and
      # never drops unknown keys, so these survive `flutter build apk`.
      - name: Setup Android Signing
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::secret KEYSTORE is empty"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties
          ls -l android/app/keystore.jks
          echo "local.properties keys: $(grep -c 'Password=\|keyAlias=' android/local.properties)"

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Rust (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo sed -i 's/azure\.ports\.ubuntu\.com/ports.ubuntu.com/g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/* 2>/dev/null || true
          for i in {1..3}; do
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true && break || sleep 5
          done
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true --fix-missing libcurl4-openssl-dev ninja-build libgtk-3-dev rpm

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"   # must match android/app + android/core build.gradle.kts
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?android sdk root not set}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          if [ ! -d "$SDK/ndk/${NDK_VERSION}" ]; then
            echo "::error::NDK ${NDK_VERSION} missing under $SDK/ndk"
            exit 1
          fi
          echo "ANDROID_NDK=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: '3.47.7'

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      # Drops android/.gradle + build/ + .dart_tool so a stale cache can never
      # mask a gradle/AGP problem. flutter clean does NOT touch local.properties
      # (only ephemeral dirs), so the signing keys survive.
      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: flutter clean

      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"

      - name: Core protocol tests (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: core/Clash.Meta
        run: |
          go build ./...
          go test ./transport/x365/... ./transport/ninja/... ./transport/oppa/... ./transport/miu/... ./common/convert/... ./adapter/ -count=1

      - name: Build Bettbox (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart linux --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only

      - name: Verify Core Protocol Markers (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $core = 'libclash/windows/BettboxCore.exe'
          if (-not (Test-Path $core)) { Write-Error "core missing: $core"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $core))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host ("CORE " + $core + " size=" + $bytes.Length)
          foreach ($k in @('fastup', 'x365', 'ninja', 'oppa', 'miu')) {
            if ($text.Contains($k)) { Write-Host "MARKER OK  : $k" } else { Write-Host "MARKER MISS: $k" }
          }

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256 (TOKEN for Helper): $coreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $coreHash

      - name: Build Bettbox (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          $flutterArgs = @(
            "build", "windows", "--release", "--verbose",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-${{ matrix.arch }}-setup.exe"
          )
          flutter @flutterArgs

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Record Windows Artifact SHA256
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host ("ARTIFACT " + $_.Name + " size=" + $_.Length + " sha256=" + $h)
          }

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-windows-${{ matrix.arch }}-installer
          path: |
            dist/*.exe
            dist/*.zip
          archive: false
          overwrite: true
          if-no-files-found: warn

      - name: Build Bettbox (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart android --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.lite == true && '--lite' || '' }}
          ls -l dist/*.apk

      # Fail closed: a lane that fell back to debug signing must never publish.
      # Compares the signer cert's SHA-256 fingerprint (not the DN text, whose
      # field order differs between apksigner/keytool output styles).
      - name: Verify APK Signing (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: a6520a36dbf79bb6a35c6921a3ae6009097d11cedf746fa2d8d5deada96d6fee
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no apk produced in dist/"
            exit 1
          fi
          for f in "${apks[@]}"; do
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/certs.txt
            fp=$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/certs.txt | head -1 | tr 'A-F' 'a-f')
            echo "signer sha256=$fp expected=$EXPECTED_CERT_SHA256"
            sha256sum "$f"
            if [ "$fp" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$f is NOT signed with the feebox release cert (debug fallback?)"
              exit 1
            fi
          done

      - name: Upload Android Artifacts
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-android-${{ matrix.arch }}${{ matrix.lite == true && '-lite' || '' }}
          path: ./dist/*.apk
          archive: false
          overwrite: true
          if-no-files-found: error

      - name: Upload Linux Artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          # dist/ holds 3 packages (AppImage/deb/rpm); 'archive: false' rejects
          # multi-file uploads, so keep the default zip for this lane.
          name: Bettbox-linux-${{ matrix.arch }}
          path: ./dist/*
          overwrite: true
          if-no-files-found: warn
