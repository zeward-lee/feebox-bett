name: ensure-private

# 保险丝：防止 build-flip 中途被杀（runner 掉线 / 手动 cancel / 超时）导致仓库长期停在 public。
#
# 逻辑：每 30 分钟检查一次仓库的 private 字段
#   - 已经是 private        → 什么都不做
#   - public 且**有运行中的 run** → 什么都不做（正常公开窗口，build 或 flip 正在进行）
#   - public 且无运行中的 run   → 转回 private（重试 + 校验）
# 也可手动 workflow_dispatch 强制走一遍检查。
#
# 注意：schedule 只在**默认分支**（main）上生效。本文件需要存在于 main 上 cron 才会跑；
# 在其他分支上只能靠 workflow_dispatch 触发（dispatch 时选该分支即可）。
#
# 与 build-flip.yaml 共用 concurrency group：翻转永不并发，不会打断正在进行的 flip。

on:
  schedule:
    # GitHub 的最小粒度是 5 分钟；30 分钟一次足以兜住异常窗口，且开销可忽略。
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: visibility-flip
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ensure-private:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      SELF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Restore private if nothing is running
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secret ADMIN_TOKEN is empty — cannot check/fix visibility"
            exit 1
          fi
          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          priv=$(api "$API" | jq -r '.private')
          echo "current private=$priv"
          if [ "$priv" = "true" ]; then
            echo "already private — nothing to do"
            exit 0
          fi

          # 排除本次保险丝自身；flip/build 只要还在跑就说明公开窗口是合法的。
          active=$(api "$API/actions/runs?per_page=100" | jq -r --arg self "$SELF_RUN_ID" '
            [ .workflow_runs[]
              | select((.id | tostring) != $self)
              | select(.status == "queued" or .status == "in_progress" or .status == "requested"
                       or .status == "waiting" or .status == "pending")
            ] | length')
          echo "active runs (excluding self): $active"
          if [ "$active" -gt 0 ]; then
            echo "a run is in flight — leaving repository public"
            exit 0
          fi

          echo "no run in flight and repository is public — restoring private"
          # PATCH 可能回 422（上一次可见性过渡还没结束），所以重试 PATCH 本身：
          # 只有 HTTP 200 且 private 字段真的变成 true 才算成功。
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/flip.json -w '%{http_code}' -X PATCH "$API" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"visibility":"private"}')
            priv=$(api "$API" | jq -r '.private')
            echo "attempt $i/12: PATCH private HTTP $code, private=$priv $(head -c 200 /tmp/flip.json)"
            if [ "$code" = "200" ] && [ "$priv" = "true" ]; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::FAILED to restore private visibility"
            exit 1
          fi
          echo "repository is PRIVATE again (fuse fired)"
          {
            echo "### ensure-private fuse fired"
            echo ""
            echo "repository was public with no run in flight — flipped back to private."
          } >> "$GITHUB_STEP_SUMMARY"
